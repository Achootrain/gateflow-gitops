apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx
  namespace: lab-rbac-support
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      access_log /dev/stdout;
      server {
        listen 8080;
        location /healthz { return 200 "ready\n"; }
        location /contract { return 200 "support-contract-v1\n"; }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: lab-rbac-support
spec:
  replicas: 1
  minReadySeconds: 180
  progressDeadlineSeconds: 230
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: support-release-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: support-release-worker
        app.kubernetes.io/part-of: support-compatibility-suite
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.27.5-alpine
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx-lab/nginx.conf"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 25m
              memory: 32Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx-lab
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
