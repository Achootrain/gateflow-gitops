apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../_base]
namePrefix: eligibility-cache-
labels:
  - pairs:
      app.kubernetes.io/name: eligibility-cache
      gateflow.io/support-role: eligibility-cache
    includeSelectors: true
    includeTemplates: true
patches:
  - target:
      kind: Deployment
      name: worker
    patch: |
      - op: add
        path: /spec/template/metadata/annotations
        value:
          gateflow.io/release: baseline
