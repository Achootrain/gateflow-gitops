apiVersion: v1
kind: ConfigMap
metadata:
  name: finance-api-nginx
  namespace: lab-rbac-finance
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      log_format evidence '$time_iso8601 request_id=$http_x_request_id status=$status remote=$remote_addr request="$request"';
      access_log /dev/stdout evidence;
      server {
        listen 8080;
        location /internal/payouts {
          add_header X-GateFlow-Service finance-api always;
          return 401 "finance authentication required\n";
        }
        location /partners/retired {
          add_header X-GateFlow-Service finance-api always;
          add_header X-Policy-Revision baseline always;
          return 200 "retired partner still accepted\n";
        }
        location /policy {
          default_type application/json;
          add_header X-GateFlow-Service finance-api always;
          add_header X-Policy-Revision baseline always;
          return 200 '{"policy_revision":"baseline","retired_partner":"accepted"}\n';
        }
        location /healthz { return 200 "ok\n"; }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finance-api
  namespace: lab-rbac-finance
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-api
  namespace: lab-rbac-finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finance-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finance-api
        app.kubernetes.io/part-of: finance-platform
      annotations:
        gateflow.io/policy-revision: baseline
    spec:
      serviceAccountName: finance-api
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.27.5-alpine
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx-lab/nginx.conf"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx-lab
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: finance-api-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: finance-api
  namespace: lab-rbac-finance
spec:
  selector:
    app.kubernetes.io/name: finance-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finance-reconciler
  namespace: lab-rbac-finance
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-reconciler
  namespace: lab-rbac-finance
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finance-reconciler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finance-reconciler
        app.kubernetes.io/part-of: settlement-platform
      annotations:
        gateflow.io/run-id: baseline
    spec:
      serviceAccountName: finance-reconciler
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              while true; do
                request_id="${RUN_ID}-finance-$(date -u +%s)"
                code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 3 -H "X-Request-ID: ${request_id}" http://finance-api.lab-rbac-finance.svc.cluster.local:8080/internal/payouts 2>/dev/null || true)"
                if [ "${code}" = "401" ]; then outcome=reachable; else outcome=blocked; fi
                echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) request_id=${request_id} source_namespace=lab-rbac-finance service_account=finance-reconciler target=finance-api expected=reachable outcome=${outcome} http_status=${code:-000}"
                partner_headers="$(curl -sS -D - -o /dev/null --connect-timeout 2 --max-time 3 -H "X-Request-ID: ${request_id}-partner" http://finance-api.lab-rbac-finance.svc.cluster.local:8080/partners/retired 2>/dev/null || true)"
                partner_code="$(printf '%s\n' "${partner_headers}" | awk '/^HTTP\// {code=$2} END {print code+0}')"
                policy_revision="$(printf '%s\n' "${partner_headers}" | awk 'BEGIN{IGNORECASE=1} /^X-Policy-Revision:/ {gsub("\\r", "", $2); print $2}')"
                echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) request_id=${request_id}-partner source_namespace=lab-rbac-finance service_account=finance-reconciler target=retired-partner policy_revision=${policy_revision:-unknown} http_status=${partner_code:-000}"
                sleep 10
              done
          env:
            - name: RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['gateflow.io/run-id']
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
