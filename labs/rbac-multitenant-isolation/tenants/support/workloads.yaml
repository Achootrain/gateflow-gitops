apiVersion: v1
kind: ConfigMap
metadata:
  name: support-api-nginx
  namespace: lab-rbac-support
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      log_format evidence '$time_iso8601 request_id=$http_x_request_id status=$status remote=$remote_addr request="$request"';
      access_log /dev/stdout evidence;
      server {
        listen 8080;
        location /sanitized/settlements {
          add_header X-GateFlow-Service support-api always;
          return 200 "sanitized support view\n";
        }
        location /healthz { return 200 "ok\n"; }
      }
    }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: support-api
  namespace: lab-rbac-support
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-api
  namespace: lab-rbac-support
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: support-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: support-api
        app.kubernetes.io/part-of: support-services
    spec:
      serviceAccountName: support-api
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.27.5-alpine
          imagePullPolicy: IfNotPresent
          command: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx-lab/nginx.conf"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx-lab
              readOnly: true
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: support-api-nginx
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: support-api
  namespace: lab-rbac-support
spec:
  selector:
    app.kubernetes.io/name: support-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: support-client
  namespace: lab-rbac-support
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-client
  namespace: lab-rbac-support
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: support-client
  template:
    metadata:
      labels:
        app.kubernetes.io/name: support-client
        app.kubernetes.io/part-of: support-platform
      annotations:
        gateflow.io/run-id: baseline
    spec:
      serviceAccountName: support-client
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: curlimages/curl:8.12.1
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              count=0
              while true; do
                count=$((count + 1))
                request_id="${RUN_ID}-support-${count}-$(date -u +%s)"
                public_code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 3 -H "X-Request-ID: ${request_id}-public" http://support-api.lab-rbac-support.svc.cluster.local:8080/sanitized/settlements 2>/dev/null || true)"
                finance_code="$(curl -sS -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 3 -H "X-Request-ID: ${request_id}-finance" http://finance-api.lab-rbac-finance.svc.cluster.local:8080/internal/payouts 2>/dev/null || true)"
                if [ "${finance_code}" = "401" ]; then finance_outcome=reachable; else finance_outcome=blocked; fi
                echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) request_id=${request_id}-public source_namespace=lab-rbac-support service_account=support-client target=support-api expected=reachable outcome=$([ "${public_code}" = "200" ] && echo reachable || echo blocked) http_status=${public_code:-000}"
                echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ) request_id=${request_id}-finance source_namespace=lab-rbac-support service_account=support-client target=finance-api expected=blocked outcome=${finance_outcome} http_status=${finance_code:-000}"
                sleep 7
              done
          env:
            - name: RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['gateflow.io/run-id']
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
