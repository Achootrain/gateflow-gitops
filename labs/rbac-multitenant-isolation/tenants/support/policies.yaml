apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: lab-rbac-support
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: lab-rbac-support
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-support-client
  namespace: lab-rbac-support
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: support-api
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: lab-rbac-support
            io.cilium.k8s.policy.serviceaccount: support-client
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-support-api-egress
  namespace: lab-rbac-support
spec:
  endpointSelector:
    matchLabels:
      io.cilium.k8s.policy.serviceaccount: support-client
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: lab-rbac-support
            app.kubernetes.io/name: support-api
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
