apiVersion: v1
kind: ServiceAccount
metadata:
  name: finance-breakglass
  namespace: lab-rbac-finance
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: finance-emergency-policy
  namespace: lab-rbac-finance
rules:
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    resourceNames: ["finance-emergency-deny"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: finance-emergency-policy
  namespace: lab-rbac-finance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: finance-emergency-policy
subjects:
  - kind: ServiceAccount
    name: finance-breakglass
    namespace: lab-rbac-finance
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: finance-emergency-deny
  namespace: lab-rbac-finance
  labels:
    gateflow.io/owner: finance-security
spec:
  endpointSelector:
    matchLabels:
      gateflow.io/emergency-target: inactive
  ingressDeny:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: lab-rbac-finance
            io.cilium.k8s.policy.serviceaccount: finance-reconciler
