apiVersion: v1
kind: Service
metadata:
  name: rbac-lab-kustomize-controller-metrics
  namespace: flux-system
  labels:
    gateflow.io/metrics: rbac-lab-kustomize-controller
spec:
  selector:
    app: kustomize-controller
  ports:
    - name: http-prom
      port: 8080
      targetPort: http-prom
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rbac-lab-kustomize-controller
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - flux-system
  selector:
    matchLabels:
      gateflow.io/metrics: rbac-lab-kustomize-controller
  endpoints:
    - port: http-prom
      interval: 5s
      scrapeTimeout: 4s
