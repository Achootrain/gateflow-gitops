apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-tenant
  namespace: lab-rbac-finance
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tenant-deployer
  namespace: lab-rbac-finance
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps", "services", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-tenant-deployer
  namespace: lab-rbac-finance
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-deployer
subjects:
  - kind: ServiceAccount
    name: flux-tenant
    namespace: lab-rbac-finance
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-budget
  namespace: lab-rbac-finance
spec:
  hard:
    pods: "6"
    requests.cpu: 40m
    requests.memory: 160Mi
    limits.cpu: 400m
    limits.memory: 512Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-defaults
  namespace: lab-rbac-finance
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 10m
        memory: 32Mi
      default:
        cpu: 100m
        memory: 128Mi
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: finance-workloads
  namespace: lab-rbac-finance
spec:
  interval: 30s
  path: ./labs/rbac-multitenant-isolation/tenants/finance
  prune: true
  wait: true
  timeout: 2m
  serviceAccountName: flux-tenant
  sourceRef:
    kind: GitRepository
    name: tenant-source
